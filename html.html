<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Погода</h1>
    </header>
    <main>
        <div class="content">
            <div class="weather-widget">
                <p class="weather-label">Погода в вашем городе</p>
                <input type="text" placeholder="Введите название города" id="city-input" class="text-area">
                <button id="get-weather-btn" class="btn">Получить погоду</button>
            </div>
            <div class="weather-info">
                <p>Температура: 20°C</p>
                <p>Влажность: 60%</p>
                <p>Скорость ветра: 10 км/ч</p>
                <p>Какая в данный момент погода</p>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
